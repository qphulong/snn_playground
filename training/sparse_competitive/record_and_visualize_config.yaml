# ============================================================
# record_and_visualize_config.yaml
#
# record:    drives Recorder  — what Brian2 data to collect
# visualize: drives visualize.py — what plots to produce
#
# ── FOCUS: 1 far-spanning Duo group ↔ 2 CNN groups ───────────
#   Duo group 8  : neurons 32-35
#                  units (2, 10) → ch 16-23 + ch 80-87
#
#   CNN group  3 : neurons 12-15, ch 12-23  → overlaps unit 2
#                  J(CNN3,  Duo8) = 8/20 = 0.40
#   CNN group 20 : neurons 80-83, ch 80-91  → overlaps unit 10
#                  J(CNN20, Duo8) = 8/20 = 0.40
#
#   Coupling     : lat_cd / lat_dc between each CNN group and Duo8
#                  within-group lat_cc / lat_dd
#                  excitatory drive via in->cnn / in->duo
#
#   All 12 neurons (3 groups × 4) fully instrumented.
#   Input keeps only its spike raster for context.
#   (weights_evolution disabled — no time-course/delta plots.)
# ============================================================


# ── Recording configuration ───────────────────────────────────────────────────

record:

  # How often to snapshot weight evolution (milliseconds)
  snapshot_interval_ms: 500

  # ── Neuron groups ───────────────────────────────────────────────────────────

  groups:

    input:
      spike_raster:       true
      mean_firing_rate:   false
      membrane_potential: []
      membrane_potential_variables: []

    cnn_hidden:
      spike_raster:       true
      mean_firing_rate:   true
      membrane_potential: [12, 13, 14, 15, 80, 81, 82, 83]   # CNN group 3 (n12-15) + CNN group 20 (n80-83)
      membrane_potential_variables: ["v", "vth", "trace_r"]

    duo_hidden:
      spike_raster:       true
      mean_firing_rate:   true
      membrane_potential: [32, 33, 34, 35]                    # Duo group 8 — units (2,10)
      membrane_potential_variables: ["v", "vth", "trace_r"]

  # ── Synapses ─────────────────────────────────────────────────────────────────
  # weights_evolution: disabled ([]).
  # final_weights_per_sample: save the full weight matrix after each sample.

  synapses:

    in->cnn:
      weights_evolution: []
      final_weights_per_sample: true

    in->duo:
      weights_evolution: []
      final_weights_per_sample: true

    lat_cc:
      weights_evolution: []
      final_weights_per_sample: true

    lat_dd:
      weights_evolution: []
      final_weights_per_sample: true

    lat_cd:
      weights_evolution: []
      final_weights_per_sample: true

    lat_dc:
      weights_evolution: []
      final_weights_per_sample: true


# ── Visualization configuration ───────────────────────────────────────────────

visualize:

  # Which samples and epochs to plot (comment out to plot all)
  visualize_samples: [0, 1]
  visualize_epoch:   [0, 1, 2, 3, 4, 5, 6, 7, 8]

  track_weight_delta: false

  # ── Neuron groups ───────────────────────────────────────────────────────────

  groups:

    input:
      spike_raster:       true
      mean_firing_rate:   false
      membrane_potential: []
      membrane_potential_variables: []

    cnn_hidden:
      spike_raster:       true
      mean_firing_rate:   true
      membrane_potential: [12, 13, 14, 15, 80, 81, 82, 83]
      membrane_potential_variables: ["v", "vth", "trace_r"]

    duo_hidden:
      spike_raster:       true
      mean_firing_rate:   true
      membrane_potential: [32, 33, 34, 35]
      membrane_potential_variables: ["v", "vth", "trace_r"]

  # ── Synapses ─────────────────────────────────────────────────────────────────

  synapses:

    in->cnn:
      weights_evolution: []
      final_weights_per_sample: true

    in->duo:
      weights_evolution: []
      final_weights_per_sample: true

    lat_cc:
      weights_evolution: []
      final_weights_per_sample: true

    lat_dd:
      weights_evolution: []
      final_weights_per_sample: true

    lat_cd:
      weights_evolution: []
      final_weights_per_sample: true

    lat_dc:
      weights_evolution: []
      final_weights_per_sample: true

  # ── Per-neuron incoming weight plots ─────────────────────────────────────────
  # Post-synaptic space: CNN targets (in->cnn, lat_cc, lat_dc) are 0-95;
  #                      Duo targets (in->duo, lat_dd, lat_cd) are 0-119.
  # Focus:
  #   CNN-target neurons : 0,1,2,3 (CNN group 0) + 80,81,82,83 (CNN group 20)
  #   Duo-target neurons : 16,17,18,19 (Duo group 4)

  weights_per_neuron:

    in->cnn:
      - 12
      - 13
      - 14
      - 15
      - 80
      - 81
      - 82
      - 83

    in->duo:
      - 32
      - 33
      - 34
      - 35

    lat_cc:
      - 12
      - 13
      - 14
      - 15
      - 80
      - 81
      - 82
      - 83

    lat_dd:
      - 32
      - 33
      - 34
      - 35

    lat_cd:
      - 32
      - 33
      - 34
      - 35

    lat_dc:
      - 12
      - 13
      - 14
      - 15
      - 80
      - 81
      - 82
      - 83
