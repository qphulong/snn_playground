    hidden:
      spike_raster:       true
      mean_firing_rate:   false
      membrane_potential: []
      membrane_potential_variables: ["v", "vth"]

  synapses:

    in->hid:
      weights_evolution:        []
      final_weights_per_sample: false


visualize_B:

  visualize_samples: []
  visualize_epoch:   []
  track_weight_delta: false

  groups:

    input:
      spike_raster:     true
      mean_firing_rate: false

    hidden:
      spike_raster:     true
      mean_firing_rate: false

  synapses:

    in->hid:
      final_weights_per_sample: false

  weights_per_neuron:
    in->hid:
      - 100
