# ============================================================
# record_and_visualize_config.yaml
#
# Four independent sections:
#   record_A    — what Brian2 data to collect during run A
#   visualize_A — what plots to produce for run A
#   record_B    — what Brian2 data to collect during run B
#   visualize_B — what plots to produce for run B
#
# Training knobs (epochs, sample_from_epoch) live in the
# record sections so all run parameters are in one place.
# ============================================================


# ── Run A ─────────────────────────────────────────────────────────────────────

record_A:

  epochs:             2
  sample_from_epoch:  1

  snapshot_interval_ms: 500

  groups:

    input:
      spike_raster:       false
      mean_firing_rate:   false
      membrane_potential: []
      membrane_potential_variables: ["v"]

    hidden:
      spike_raster:       true
      mean_firing_rate:   true
      membrane_potential: []
      membrane_potential_variables: ["v", "vth", "is_winner"]

  synapses:

    in->hid:
      weights_evolution:
      final_weights_per_sample: true


visualize_A:

  visualize_samples: []   # empty = all samples
  visualize_epoch:   []   # empty = all epochs
  track_weight_delta: false

  groups:

    input:
      spike_raster:     false
      mean_firing_rate: false

    hidden:
      spike_raster:     true
      mean_firing_rate: true

  synapses:

    in->hid:
      weights_evolution:
      final_weights_per_sample: true

  weights_per_neuron:
    in->hid:
      - 100
      - 350


# ── Run B ─────────────────────────────────────────────────────────────────────

record_B:

  epochs:             2
  sample_from_epoch:  1

  snapshot_interval_ms: 500

  groups:

    input:
      spike_raster:       false
      mean_firing_rate:   false
      membrane_potential: []
      membrane_potential_variables: ["v"]

    hidden:
      spike_raster:       true
      mean_firing_rate:   true
      membrane_potential: []
      membrane_potential_variables: ["v", "vth", "is_winner"]

  synapses:

    in->hid:
      weights_evolution:
      final_weights_per_sample: true


visualize_B:

  visualize_samples: []
  visualize_epoch:   []
  track_weight_delta: false

  groups:

    input:
      spike_raster:     false
      mean_firing_rate: false

    hidden:
      spike_raster:     true
      mean_firing_rate: true

  synapses:

    in->hid:
      weights_evolution:
      final_weights_per_sample: true

  weights_per_neuron:
    in->hid:
      - 100
      - 350
