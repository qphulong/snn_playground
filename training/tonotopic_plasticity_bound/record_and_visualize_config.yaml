# ============================================================
# record_and_visualize_config.yaml
#
# record:    drives Recorder  — what Brian2 data to collect
# visualize: drives visualize.py — what plots to produce
#
# The two sections are fully independent: recorder.py reads only
# from record:, and visualize.py reads only from visualize:.
# ============================================================


# ── Recording configuration ───────────────────────────────────────────────────

record:

  snapshot_interval_ms: 500

  groups:

    input:
      spike_raster:       true
      mean_firing_rate:   true
      membrane_potential: []
      membrane_potential_variables: []

    hidden:
      spike_raster:       true
      mean_firing_rate:   true
      membrane_potential: []
      membrane_potential_variables: [v, vth, trace_r]

  synapses:

    in->hid:
      weights_evolution:        []
      final_weights_per_sample: true

    hid->hid:
      weights_evolution:        []
      final_weights_per_sample: true


# ── Visualization configuration ───────────────────────────────────────────────

visualize:

  visualize_samples: [0]
  visualize_epoch:   [0,1,2,3,4,5,6,7]

  track_weight_delta: false

  groups:

    input:
      spike_raster:       true
      mean_firing_rate:   true
      membrane_potential: []
      membrane_potential_variables: []
      # Color raster / spike-count / firing-rate by neuron type.
      # Order matches compute_spike_input_current's (sustained, onset, phase)
      # per-band layout; counts must sum to neurons_per_band (= 3).
      neuron_types:
        - {name: sustained, count: 1, color: steelblue}
        - {name: onset,     count: 1, color: crimson}
        - {name: phase,     count: 1, color: darkorange}

    hidden:
      spike_raster:       true
      mean_firing_rate:   true
      membrane_potential: []
      membrane_potential_variables: [v, vth, trace_r]

  synapses:

    in->hid:
      weights_evolution:        []
      final_weights_per_sample: true

    hid->hid:
      weights_evolution:        []
      final_weights_per_sample: true

  weights_per_neuron:
    in->hid:
      - 108
      - 109
      - 110
      - 111
      - 112
      - 113
      - 114
      - 115
      - 116
    hid->hid:
      - 108
      - 109
      - 110
      - 111
      - 112
      - 113
      - 114
      - 115
      - 116
