# ============================================================
# record_and_visualize_config.yaml
#
# record:    drives Recorder  — what Brian2 data to collect
# visualize: drives visualize.py — what plots to produce
#
# The two sections are fully independent: recorder.py reads only
# from record:, and visualize.py reads only from visualize:.
# ============================================================


# ── Recording configuration ───────────────────────────────────────────────────

record:

  snapshot_interval_ms: 500

  groups:

    input:
      spike_raster:       true
      mean_firing_rate:   true
      membrane_potential: []
      membrane_potential_variables: []

    hidden:
      spike_raster:       true
      mean_firing_rate:   true
      # Membrane potential visualization disabled — no neuron ids to trace,
      # so no StateMonitor is attached and no membrane_potential.npz is written.
      membrane_potential: []
      membrane_potential_variables: []

  synapses:

    in->hid:
      weights_evolution:        []
      final_weights_per_sample: true

    hid->hid:
      weights_evolution:        []
      final_weights_per_sample: true


# ── Visualization configuration ───────────────────────────────────────────────

visualize:

  visualize_samples: [0]
  visualize_pieces:  [12,20]  # only piece_0020
  visualize_epoch:   []   # empty = all epochs (repeats) within each piece

  track_weight_delta: false

  groups:

    input:
      spike_raster:       true
      mean_firing_rate:   true
      membrane_potential: []
      membrane_potential_variables: []
      # Color raster / spike-count / firing-rate by neuron type.
      # Order matches compute_spike_input_current's (sustained, onset)
      # per-band layout; counts must sum to neurons_per_band (= 2).
      neuron_types:
        - {name: sustained, count: 1, color: steelblue}
        - {name: onset,     count: 1, color: crimson}

    hidden:
      spike_raster:       true
      mean_firing_rate:   true
      membrane_potential: []
      membrane_potential_variables: []

  synapses:

    in->hid:
      weights_evolution:        []
      final_weights_per_sample: true

    hid->hid:
      weights_evolution:        []
      final_weights_per_sample: true

  weights_per_neuron: {}
