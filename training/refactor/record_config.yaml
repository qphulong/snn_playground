# ============================================================
# record_config.yaml
#
# Keys under 'groups' must match the name passed to recorder.track_group().
# Keys under 'synapses' must match the name passed to recorder.track_synapses().
# Unregistered keys are ignored. Registered objects with no key here record nothing.
# ============================================================

# How often to snapshot weight evolution (milliseconds)
snapshot_interval_ms: 500


# ── Neuron groups ─────────────────────────────────────────────────────────────

groups:

  input:
    spike_raster:       false
    mean_firing_rate:   false
    membrane_potential: []          # list of neuron indices, or [idx, [t0_ms, t1_ms]]
    membrane_potential_variables: ["v"]

  hidden:
    spike_raster:       true
    mean_firing_rate:   true
    membrane_potential:             # monitor neurons 0 and 350 with a time window
      - [0,   [0, 500]]
      - [350, [0, 500]]
    membrane_potential_variables: ["v", "vth", "is_winner"]

  # ── Template for a new group ──────────────────────────────────────────────
  # Uncomment and rename when you add a new NeuronGroup in train.py.
  #
  # output:
  #   spike_raster:       true
  #   mean_firing_rate:   true
  #   membrane_potential: []
  #   membrane_potential_variables: ["v"]


# ── Synapse groups ────────────────────────────────────────────────────────────

synapses:

  in->hid:
    # Track weight evolution for specific (pre, post) pairs over time
    weights_evolution:
      - [0,   0]
      - [100, 100]
      - [350, 350]
    # Save the full weight matrix snapshot after each sample
    final_weights_per_sample: true

  # ── Template for a new synapse group ──────────────────────────────────────
  # Uncomment and rename when you add a new Synapses object in train.py.
  #
  # hid->out:
  #   weights_evolution:
  #     - [0, 0]
  #     - [50, 10]
  #   final_weights_per_sample: false