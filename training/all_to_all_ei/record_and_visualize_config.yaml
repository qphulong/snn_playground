# ============================================================
# record_and_visualize_config.yaml
#
# record:    drives Recorder  — what Brian2 data to collect
# visualize: drives visualize.py — what plots to produce
#
# The two sections are fully independent: recorder.py reads only
# from record:, and visualize.py reads only from visualize:.
# ============================================================


# ── Recording configuration ───────────────────────────────────────────────────

record:

  # How often to snapshot weight evolution (milliseconds)
  snapshot_interval_ms: 500

  # ── Neuron groups ───────────────────────────────────────────────────────────

  groups:

    input:
      spike_raster:       true
      mean_firing_rate:   true

    hidden:
      spike_raster:       true
      mean_firing_rate:   true

  # ── Synapse groups ──────────────────────────────────────────────────────────

  synapses:
    in->hid:
      weights_evolution:
      final_weights_per_sample: true
    hid->hid:
      weights_evolution:
      final_weights_per_sample: true


# ── Visualization configuration ───────────────────────────────────────────────

visualize:

  # Which samples and epochs to plot (comment out to plot all)
  visualize_samples: [0]
  visualize_epoch:   [3]

  track_weight_delta: false

  # ── Neuron groups ───────────────────────────────────────────────────────────

  groups:

    input:
      spike_raster:       true
      mean_firing_rate:   true
      # Color raster / spike-count / firing-rate plots by neuron type.
      # Order must match the per-band layout used by compute_spike_input_current
      # (sustained, then onset, then phase). counts must sum to neurons_per_band.
      neuron_types:
        - {name: sustained, count: 4, color: steelblue}
        - {name: onset,     count: 2, color: crimson}
        - {name: phase,     count: 1, color: darkorange}

    hidden:
      spike_raster:       true
      mean_firing_rate:   true

  # ── Synapse groups ──────────────────────────────────────────────────────────

  synapses:
    in->hid:
      weights_evolution:
      final_weights_per_sample: true
    hid->hid:
      weights_evolution:
      final_weights_per_sample: true

  # ── Per-neuron incoming weight plots ────────────────────────────────────────

  weights_per_neuron:
    in->hid:
      - 0
      - 100
      - 200
      - 300
      - 398
      - 399
      - 400
      - 401
      - 402
      - 500
