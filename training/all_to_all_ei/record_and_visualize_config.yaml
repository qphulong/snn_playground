# ============================================================
# record_and_visualize_config.yaml
#
# record:    drives Recorder  — what Brian2 data to collect
# visualize: drives visualize.py — what plots to produce
#
# The two sections are fully independent: recorder.py reads only
# from record:, and visualize.py reads only from visualize:.
# ============================================================


# ── Recording configuration ───────────────────────────────────────────────────

record:

  # How often to snapshot weight evolution (milliseconds)
  snapshot_interval_ms: 500

  # ── Neuron groups ───────────────────────────────────────────────────────────

  groups:

    input:
      spike_raster:       true
      mean_firing_rate:   true

    # hidden:
    #   spike_raster:       true
    #   mean_firing_rate:   true
    #   membrane_potential:
    #   membrane_potential_variables: ["v", "vth"]

  # ── Synapse groups ──────────────────────────────────────────────────────────

  # synapses:
  #   in->hid:
  #     weights_evolution:
  #     final_weights_per_sample: true


# ── Visualization configuration ───────────────────────────────────────────────

visualize:

  # Which samples and epochs to plot (comment out to plot all)
  visualize_samples: [0, 1, 2, 3]
  visualize_epoch:   [0,1,2,3]

  track_weight_delta: false

  # ── Neuron groups ───────────────────────────────────────────────────────────

  groups:

    input:
      spike_raster:       true
      mean_firing_rate:   true

    # hidden:
    #   spike_raster:       true
    #   mean_firing_rate:   true
    #   membrane_potential:
    #   membrane_potential_variables: ["v", "vth"]

  # ── Synapse groups ──────────────────────────────────────────────────────────

  # synapses:
  #   in->hid:
  #     weights_evolution:
  #       - [0,   0]
  #       - [100, 100]
  #       - [350, 350]
  #     final_weights_per_sample: true

  # ── Per-neuron incoming weight plots ────────────────────────────────────────

  # weights_per_neuron:
  #   in->hid:
  #     - 0
  #     - 100
  #     - 350
