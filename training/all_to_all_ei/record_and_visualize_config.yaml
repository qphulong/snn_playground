# ============================================================
# record_and_visualize_config.yaml
#
# record:    drives Recorder  — what Brian2 data to collect
# visualize: drives visualize.py — what plots to produce
#
# The two sections are fully independent: recorder.py reads only
# from record:, and visualize.py reads only from visualize:.
# ============================================================


# ── Recording configuration ───────────────────────────────────────────────────

record:

  # How often to snapshot weight evolution (milliseconds)
  snapshot_interval_ms: 500

  # ── Neuron groups ───────────────────────────────────────────────────────────

  groups:

    input:
      spike_raster:       true
      mean_firing_rate:   true

    hidden:
      spike_raster:       true
      mean_firing_rate:   true

  # ── Synapse groups ──────────────────────────────────────────────────────────

  synapses:
    in->hid:
      final_weights_per_sample: true
    hid->hid:
      final_weights_per_sample: true


# ── Visualization configuration ───────────────────────────────────────────────

visualize:

  # Which samples and epochs to plot (comment out to plot all)
  visualize_samples: [0, 1, 2, 3]
  visualize_epoch:   [0,1]

  track_weight_delta: false

  # ── Neuron groups ───────────────────────────────────────────────────────────

  groups:

    input:
      spike_raster:       true
      mean_firing_rate:   true

    hidden:
      spike_raster:       true
      mean_firing_rate:   true

  # ── Input neuron type layout (for colouring input plots by spike type) ───────
  # Must match the encoding in train.py (ENC_SUSTAINED / ENC_ONSET / ENC_PHASE).
  # Input raster / spike-count / mean-firing-rate plots for `group` colour each
  # neuron by type: sustained / onset / phase.
  input_neuron_layout:
    group:               input
    sustained_per_band:  4
    onset_per_band:      2
    phase_per_band:      1

  # ── Synapse groups ──────────────────────────────────────────────────────────

  synapses:
    in->hid:
      final_weights_per_sample: true
    hid->hid:
      final_weights_per_sample: true

  # ── Per-neuron incoming weight plots ────────────────────────────────────────

  weights_per_neuron:
    in->hid:
      - 0
      - 100
      - 200
      - 300
      - 400
      - 500
      - 600
    hid->hid:
      - 0
      - 100
      - 200
      - 300
      - 400
      - 500
      - 600
